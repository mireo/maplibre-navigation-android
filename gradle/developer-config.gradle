//
// Configuration file for gradle build execution.
//

task accessToken {
    def tokenFile = new File("${projectDir}/src/main/res/values/developer-config.xml")
    if (!tokenFile.exists()) {
        String tokenFileContents = "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n" +
                "<resources>\n" +
                "    <string name=\"base_url\" translatable=\"false\">https://maps.mireo.com</string>\n" +
                "    <string name=\"valhalla_url\" translatable=\"false\">https://maps.mireo.com/directions/v5</string>\n" +
                "    <string name=\"mapbox_access_token\" translatable=\"false\">pk.dummy.token.mireo.mapbox.api.ImNqOHg0bzlqeDF3Z20ycXFxcXRrZ3VvNG4ifQ.OxmT2cJG1PGA34tse_ILSw</string>\n" +
                "    <string name=\"map_style_light\" translatable=\"false\">https://maps.mireo.com/style/mireo-style.json</string>\n" +
                "    <string name=\"map_style_dark\" translatable=\"false\">https://maps.mireo.com/style/mireo-style-dark.json</string>\n" +
                "</resources>"
        tokenFile.write(tokenFileContents)
    }
}

gradle.projectsEvaluated {
    preBuild.dependsOn('accessToken')
}